<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
            color: #38bdf8;
            text-shadow: 0 0 10px #38bdf8;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            width: 200px;
            text-align: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #38bdf8;
        }

        .votes {
            font-size: 24px;
            color: #22c55e;
        }

        .percent {
            color: #facc15;
        }

        img {
            margin-bottom: 10px;
        }

        canvas {
            margin-top: 50px;
        }
    </style>
</head>

<body>

<h2>🚀 Election Results</h2>

<div class="container">

    <div class="cards">
        {% for row in data %}
        <div class="card">
            <img src="/static/{{row[0]|lower}}.png" width="60">
            <h3>{{row[0]}}</h3>
            <div class="votes">{{row[1]}} votes</div>
            <div class="percent">{{row[2]|round(2)}}%</div>
        </div>
        {% endfor %}
    </div>

    <canvas id="myChart"></canvas>

</div>

<script>
    const labels = [
        {% for row in data %}
            "{{row[0]}}",
        {% endfor %}
    ];

    const values = [
        {% for row in data %}
            {{row[2]|round(2)}},
        {% endfor %}
    ];

    new Chart(document.getElementById("myChart"), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Vote %',
                data: values,
                backgroundColor: [
                    '#38bdf8', '#22c55e', '#facc15', '#ef4444'
                ]
            }]
        }
    });
</script>

<script>
    setTimeout(function(){
        window.location.href = "/";
    }, 20000);
</script>

</body>
</html>
